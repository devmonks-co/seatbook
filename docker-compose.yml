services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seatbook
      POSTGRES_PASSWORD: seatbook
      POSTGRES_DB: seatbook
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatbook"]
      interval: 2s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://seatbook:seatbook@db:5432/seatbook
      PORT: 4000
      # Development only. Production must set its own long random secret.
      JWT_SECRET: dev-only-secret-change-me-in-production-0123456789
      CORS_ORIGIN: http://localhost:5173
      # Wiped by `docker compose exec server npm test`
      TEST_DATABASE_URL: postgresql://seatbook:seatbook@db:5432/seatbook_test
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/src:/app/src
      - ./server/prisma:/app/prisma

  client:
    build: ./client
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./client/src:/app/src

volumes:
  db-data:
